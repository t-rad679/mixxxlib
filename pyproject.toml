[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mixxxlib"
dynamic = ["version"]
description = "Offline CLI and library for reading and writing a Mixxx library"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "typer>=0.12",
  "mutagen>=1.47",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "shiv>=1.0.6",
]

[project.scripts]
mixxxlib = "mixxxlib.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "mixxxlib.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
